[package]
name = "agent2plugin-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0"
description = "Agent2API 示例插件：实现 Provider trait 的最小可运行形态"
repository = "https://github.com/Agent2plugin/Agent2plugin"

# ── 为什么用 tag 而不是 path ──────────────────────────────────
# 第三方插件作者 clone 这个仓库就能直接 `cargo build`，不需要同时
# 在本地放一份 Agent2Providers。tag 钉住契约版本：协议改了就换 tag，
# 而不是让「今天能编、明天不能编」变成一个悬空依赖。
[dependencies]
agent2api-provider-protocol = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v0.1.0" }
agent2api-provider-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v0.1.0" }
serde_json = "1"

[profile.release]
# 与官方插件包同一取向：崩一个 provider 不该带走整个插件进程，
# 但单个请求边界上的 panic 要能被 catch_unwind 兜住。
panic = "unwind"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
